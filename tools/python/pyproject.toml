[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robustio"
version = "0.3.0"
description = "Host tools for the Robust IO board: CAN protocol, device access, CLI, DBC, simulator bus"
requires-python = ">=3.8"
dependencies = ["python-can>=4.0"]

[project.optional-dependencies]
test = ["pytest", "cantools"]
bringup = ["pyserial"]

[project.scripts]
robustio = "robustio.cli:main"

[tool.setuptools]
packages = ["robustio"]
